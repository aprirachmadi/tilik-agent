[project]
name = "tilik-agent"
version = "0.1.0"
description = "Indonesian data analyst with BPS, BNPB, and BMKG source connectors"
authors = [{ name = "Tilik Agent Contributors" }]
license = "LicenseRef-Proprietary"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = true
packages = [{include = "tilik_agent", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# Configuration and validation
pydantic = "^2.10"
pydantic-settings = "^2.7"
python-dotenv = "^1.0"
pyyaml = "^6.0"

# HTTP clients (BPS API, tool calls, web fetch)
httpx = "^0.28"
tenacity = "^9.0"

# LLM providers (install keys via .env: OPENAI_API_KEY, ANTHROPIC_API_KEY, etc.)
openai = "^1.60"
anthropic = "^0.45"
tiktoken = "^0.9"

# LangChain / LangGraph agent stack
langchain = "^0.3"
langchain-core = "^0.3"
langchain-community = "^0.3"
langchain-openai = "^0.3"
langchain-anthropic = "^0.3"
langgraph = "^0.2"
langgraph-checkpoint = "^2.0"

# Model Context Protocol (tools, external integrations)
mcp = "^1.8"

# Data handling (CSV samples, observation tables, analytics)
pandas = "^2.2"
numpy = "^2.2"
plotly = "^6.0"
pyarrow = "^19.0"
sqlalchemy = "^2.0"

# RAG over BPS publications and docs (Qdrant server run separately, e.g. Docker on :6333)
# Docling: PDF → markdown/layout (pip-only; also pulled by pdfmux[tables])
docling = "^2.87"
pdfmux = { version = "^1.8", extras = ["ocr", "tables"] }
langchain-pdfmux = "^0.2"
langchain-text-splitters = "^0.3"
langchain-huggingface = { version = "^0.3", extras = ["full"] }
sentence-transformers = "^3.0"
qdrant-client = "^1.15"
langchain-qdrant = "^0.2"
langchain-postgres = "^0.0.16"
psycopg = { version = "^3.2", extras = ["binary"] }
torch = { version = "2.14.0+cpu", source = "pytorch-cpu" }
torchvision = { version = "0.29.0+cpu", source = "pytorch-cpu" }

# API / service surface for the agent
fastapi = "^0.115"
uvicorn = { version = "^0.34", extras = ["standard"] }

# CLI and structured logging
typer = "^0.15"
rich = "^13.9"
structlog = "^24.4"

# Observability and offline eval (Langfuse: traces, datasets, experiments; DeepEval: metrics / LLM-judge)
langfuse = "^4.15"
deepeval = "^4.2"
xlrd = "^2.0.2"
openpyxl = "^3.1.5"
alembic = "^1.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-cov = "^6.0"
ruff = "^0.9"
mypy = "^1.14"
types-requests = "^2.32"
pandas-stubs = "^2.2"
ipykernel = "^7.3.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.scripts]
tilik = "tilik_agent.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
