[project]
name = "tilik-agent"
version = "0.1.0"
description = "AI agents for querying and reasoning over BPS statistical data"
authors = [{ name = "Tilik Agent Contributors" }]
license = "LicenseRef-Proprietary"
requires-python = ">=3.11,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Configuration and validation
pydantic = "^2.10"
pydantic-settings = "^2.7"
python-dotenv = "^1.0"

# HTTP clients (BPS API, tool calls, web fetch)
httpx = "^0.28"
tenacity = "^9.0"

# LLM providers (install keys via .env: OPENAI_API_KEY, ANTHROPIC_API_KEY, etc.)
openai = "^1.60"
anthropic = "^0.45"
tiktoken = "^0.9"

# LangChain / LangGraph agent stack
langchain = "^0.3"
langchain-core = "^0.3"
langchain-community = "^0.3"
langchain-openai = "^0.3"
langchain-anthropic = "^0.3"
langgraph = "^0.2"
langgraph-checkpoint = "^2.0"

# Model Context Protocol (tools, external integrations)
mcp = "^1.8"

# Data handling (CSV samples, observation tables, analytics)
pandas = "^2.2"
numpy = "^2.2"
pyarrow = "^19.0"
sqlalchemy = "^2.0"

# Optional RAG over docs / table metadata (enable when you add embeddings)
# chromadb = "^0.6"
# langchain-chroma = "^0.2"

# API / service surface for the agent
fastapi = "^0.115"
uvicorn = { version = "^0.34", extras = ["standard"] }

# CLI and structured logging
typer = "^0.15"
rich = "^13.9"
structlog = "^24.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-cov = "^6.0"
ruff = "^0.9"
mypy = "^1.14"
types-requests = "^2.32"
pandas-stubs = "^2.2"

[tool.poetry.scripts]
# tilik = "tilik_agent.cli:app"  # uncomment when src/tilik_agent exists

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
