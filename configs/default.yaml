llm:
  model: orvix/deepseek-v4.1-flash
  base_url: https://api.orvix.id/v1
  temperature: 0
  api_key_env: OPENAI_API_KEY
  extra_body: {}
  max_tokens: 8192

embedding:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  device: cpu
  normalize_embeddings: true

retrieval:
  collection: bps-sp2020-demografi
  top_k: 5
  max_rewrites: 2

dataset_lookup:
  max_search_results: 15
  max_measures: 30
  max_dimension_members: 200
  max_periods: 50
  max_observations: 500
  max_tool_rounds: 8

graph:
  recursion_limit: 25

conversation:
  # Most recent user and assistant messages sent to the planner and answer writer.
  # 6 messages = the last 3 turns.
  max_history_messages: 6

evals:
  judge:
    model: orvix/deepseek-v4.1-flash
    base_url: https://api.orvix.id/v1
    temperature: 0
    api_key_env: OPENAI_API_KEY
    extra_body: {}
    max_tokens: 8192
  metrics:
    task_completion:
      enabled: true
      threshold: 0.5
    argument_correctness:
      enabled: true
      threshold: 0.5
    # Raw graph status (succeeded, partial, failed). Not an LLM-as-a-judge metric.
    pipeline_status:
      enabled: true
  conversation_metrics:
    goal_accuracy:
      enabled: true
      threshold: 0.5
    tool_use:
      enabled: true
      threshold: 0.5
    conversation_completeness:
      enabled: true
      threshold: 0.5
    turn_relevancy:
      enabled: false
      threshold: 0.5
    pipeline_status:
      enabled: true
