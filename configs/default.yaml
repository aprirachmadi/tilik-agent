llm:
  model: qwen3.8-flash
  base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
  temperature: 0
  api_key_env: OPENAI_API_KEY
  extra_body:
    enable_thinking: false

embedding:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  device: cpu
  normalize_embeddings: true

retrieval:
  collection: bps-sp2020-demografi
  top_k: 5
  max_rewrites: 2

dataset_lookup:
  max_search_results: 15
  max_measures: 30
  max_dimension_members: 200
  max_periods: 50
  max_observations: 100
  max_tool_rounds: 8

graph:
  recursion_limit: 25

evals:
  judge:
    model: qwen3.8-flash
    base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    temperature: 0
    api_key_env: OPENAI_API_KEY
    extra_body:
      enable_thinking: false
  metrics:
    task_completion:
      enabled: true
      threshold: 0.5
    argument_correctness:
      enabled: true
      threshold: 0.5
    # Raw graph status (succeeded, partial, failed). Not an LLM-as-a-judge metric.
    pipeline_status:
      enabled: true
